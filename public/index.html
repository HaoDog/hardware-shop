<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f5e8c8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>智能硬件商店</title>
    <link rel="stylesheet" href="./shop.css?v=10" />
  </head>
  <body>
    <header class="chrome">
      <div class="topbar">
        <div class="brand">
          <p class="eyebrow">✦ Course Hardware ✦</p>
          <h1>智能硬件商店</h1>
        </div>
        <button type="button" class="cart-chip" id="cartChip" onclick="openSheet('cart')">
          清单<span class="badge" id="cartBadge">0</span>
        </button>
      </div>
      <nav id="shelves" class="tabs"></nav>
    </header>

    <main class="wrap">
      <p class="lede">不买也能上课。想带回家，选基础款套餐，或按件加入清单后扫学费码。</p>
      <div class="layout">
        <div id="grid" class="grid"></div>
        <aside id="cart" class="cart desktop-cart"></aside>
      </div>
    </main>

    <footer id="dock" class="dock"></footer>
    <div id="mask" class="mask" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script src="./catalog.js?v=10"></script>
    <script src="./shop.js?v=10"></script>
  </body>
</html>
